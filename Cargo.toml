[package]
name = "overview"
version = "0.2.0"
edition = "2021"
description = "Flash-style tab switcher for Zellij"
license = "AGPL-3.0-only"

[dependencies]
ratatui = { version = "0.30.2", default-features = false }
zellij-tile = "0.44"

[lib]
name = "overview"
path = "src/lib.rs"

[[bin]]
name = "overview"
path = "src/main.rs"
test = false
doctest = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
