[package]
name = "zellij-overview"
version = "0.5.2"
edition = "2021"
description = "Flash-style tab switcher for Zellij"
license = "MIT"

[dependencies]
ratatui = { version = "0.30.2", default-features = false }
zellij-tile = "0.44"
crossterm = { version = "0.28", optional = true }

[features]
tui = ["dep:crossterm"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "zellij-overview"
path = "src/main.rs"
test = false
doctest = false

[[bin]]
name = "overview-tui"
path = "src/bin/overview_tui.rs"
test = false
doctest = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
